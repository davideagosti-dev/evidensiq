# Publish npm Package — Trusted Publishing / OIDC (EVI-REL-0.3)
#
# Triggered only by version tags (vX.Y.Z | vX.Y.Z-alpha.N | vX.Y.Z-beta.N | vX.Y.Z-rc.N).
# Does not publish on branch pushes or PRs.
# Authentication uses npm Trusted Publishing (OIDC). No long-lived NPM_TOKEN.
# Filename is security-sensitive: npm Trusted Publisher binds to publish-npm.yml.
#
# Release maturity channels:
#   X.Y.Z           -> --tag latest
#   X.Y.Z-alpha.N   -> --tag alpha
#   X.Y.Z-beta.N    -> --tag beta
#   X.Y.Z-rc.N      -> --tag next
# Prereleases must never receive latest (enforced by scripts/release-channel.mjs).

name: Publish npm Package

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish @evidensiq/core
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Node 24 is preferred for Trusted Publishing–compatible npm defaults.
      # Do not set registry-url here: it can write an empty _authToken and
      # force token auth, which breaks OIDC Trusted Publishing.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      # Bounded npm@11 major (≥ 11.5.1 / ≥ 11.15.0 for trust CLI; CI publish needs OIDC support).
      - name: Ensure npm 11
        run: |
          npm install -g npm@11
          node --version
          npm --version

      - name: Install
        run: npm ci

      - name: Format
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Typecheck (tsc --noEmit)
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Pack dry-run
        run: npm run pack:check

      - name: Northstar demo
        run: npm run demo:northstar

      - name: Audit
        run: npm audit

      - name: Validate release-channel resolver
        run: npm run release:channel:self-test

      - name: Resolve release channel and verify version consistency
        id: channel
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          RESOLVED="$(node scripts/release-channel.mjs resolve "${TAG}")"
          echo "resolved=${RESOLVED}"
          EXPECTED="$(node -p "JSON.parse(process.argv[1]).version" "${RESOLVED}")"
          DIST_TAG="$(node -p "JSON.parse(process.argv[1]).distTag" "${RESOLVED}")"
          CHANNEL="$(node -p "JSON.parse(process.argv[1]).channel" "${RESOLVED}")"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          LOCK_VERSION="$(node -p "require('./package-lock.json').version")"
          LOCK_PKG_VERSION="$(node -p "require('./package-lock.json').packages[''].version")"
          echo "tag=${TAG}"
          echo "expected_version=${EXPECTED}"
          echo "dist_tag=${DIST_TAG}"
          echo "channel=${CHANNEL}"
          echo "package.json=${PKG_VERSION}"
          echo "package-lock.json root=${LOCK_VERSION}"
          echo "package-lock.json packages['']=${LOCK_PKG_VERSION}"
          if [[ "${PKG_VERSION}" != "${EXPECTED}" ]]; then
            echo "::error::package.json version (${PKG_VERSION}) does not match tag version (${EXPECTED})"
            exit 1
          fi
          if [[ "${LOCK_VERSION}" != "${PKG_VERSION}" ]]; then
            echo "::error::package-lock.json root version (${LOCK_VERSION}) does not match package.json (${PKG_VERSION})"
            exit 1
          fi
          if [[ "${LOCK_PKG_VERSION}" != "${PKG_VERSION}" ]]; then
            echo "::error::package-lock.json packages[''].version (${LOCK_PKG_VERSION}) does not match package.json (${PKG_VERSION})"
            exit 1
          fi
          # Defense-in-depth: prerelease must never publish to latest.
          if [[ "${PKG_VERSION}" == *-* && "${DIST_TAG}" == "latest" ]]; then
            echo "::error::prerelease safety invariant violated: '${PKG_VERSION}' must not use dist-tag latest"
            exit 1
          fi
          if [[ "${PKG_VERSION}" != *-* && "${DIST_TAG}" != "latest" ]]; then
            echo "::error::stable safety invariant violated: '${PKG_VERSION}' must use dist-tag latest"
            exit 1
          fi
          echo "version_consistency=PASS"
          echo "dist_tag=${DIST_TAG}" >> "${GITHUB_OUTPUT}"
          echo "version=${PKG_VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Guard against duplicate registry version
        run: |
          set -euo pipefail
          PKG_NAME="$(node -p "require('./package.json').name")"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if npm view "${PKG_NAME}@${PKG_VERSION}" version >/dev/null 2>&1; then
            echo "::error::${PKG_NAME}@${PKG_VERSION} already exists on the registry. Refusing to publish."
            exit 1
          fi
          echo "registry_duplicate_guard=PASS (${PKG_NAME}@${PKG_VERSION} not found)"

      # Trusted Publishing authenticates via OIDC (id-token: write).
      # Provenance is generated automatically for eligible public packages.
      # Do not supply NPM_TOKEN / NODE_AUTH_TOKEN. Do not set provenance=false.
      # Always pass an explicit --tag so prereleases cannot become latest by default.
      - name: Publish to npm
        env:
          DIST_TAG: ${{ steps.channel.outputs.dist_tag }}
        run: |
          set -euo pipefail
          if [[ -z "${DIST_TAG}" ]]; then
            echo "::error::dist-tag was not resolved"
            exit 1
          fi
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [[ "${PKG_VERSION}" == *-* && "${DIST_TAG}" == "latest" ]]; then
            echo "::error::prerelease safety invariant violated immediately before publish"
            exit 1
          fi
          echo "publishing ${PKG_VERSION} with --tag ${DIST_TAG}"
          npm publish --access public --tag "${DIST_TAG}"
